<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Store</title>
    <a href="brooksvij OS.html">Home</a>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text: #f8fafc;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .app-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .app-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.1rem;
        }

        /* Modal / Settings Panel */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 12px;
            width: 90%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input, textarea {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
        }

        textarea {
            height: 120px;
        }

        .close-btn {
            background: #ef4444;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1> App Store</h1>
        <button onclick="openSettings()">⚙️ Settings</button>
    </header>

    <main class="app-grid" id="appGrid">
        <!-- Apps render here -->
    </main>

    <!-- Settings Modal -->
    <div class="modal" id="settingsModal">
        <div class="modal-content">
            <h2>Admin Settings</h2>
            <label>App Name:</label>
            <input type="text" id="appName" placeholder="e.g., Mini Calculator">
            
            <label>App HTML / JS / CSS (Inline code):</label>
            <textarea id="appCode" placeholder="&lt;p&gt;Hello World&lt;/p&gt;&lt;script&gt;alert('Hi!');&lt;/script&gt;"></textarea>
            
            <button onclick="addNewApp()">Add App</button>
            <button class="close-btn" onclick="closeSettings()">Close</button>
        </div>
    </div>

    <script>
        // Default secret PIN for settings (Change '1234' to your own PIN)
        const ADMIN_PIN = "98114111111107118105106";

        // Load saved apps from LocalStorage or start empty
        let apps = JSON.parse(localStorage.getItem('storeApps')) || [];

        function renderApps() {
            const grid = document.getElementById('appGrid');
            grid.innerHTML = '';
            apps.forEach((app, index) => {
                const card = document.createElement('div');
                card.className = 'app-card';
                card.innerHTML = `
                    <div>
                        <h3>${app.name}</h3>
                        <div style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px;">Custom App</div>
                    </div>
                    <div>
                        <button onclick="launchApp(${index})">Launch</button>
                        <button style="background:#ef4444; margin-left: 6px;" onclick="deleteApp(${index})">Del</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openSettings() {
            const pin = prompt("Enter Admin PIN:");
            if (pin === ADMIN_PIN) {
                document.getElementById('settingsModal').style.display = 'flex';
            } else {
                alert("Incorrect PIN!");
            }
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function addNewApp() {
            const name = document.getElementById('appName').value.trim();
            const code = document.getElementById('appCode').value.trim();

            if (!name || !code) {
                alert("Please fill out both fields.");
                return;
            }

            apps.push({ name, code });
            localStorage.setItem('storeApps', JSON.stringify(apps));
            document.getElementById('appName').value = '';
            document.getElementById('appCode').value = '';
            closeSettings();
            renderApps();
        }

        function launchApp(index) {
            const app = apps[index];
            const newWindow = window.open('', '_blank');
            newWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head><title>${app.name}</title></head>
                <body style="font-family:sans-serif; background:#0f172a; color:white; padding:20px;">
                    <h2>${app.name}</h2>
                    <hr style="border-color:#334155;">
                    ${app.code}
                </body>
                </html>
            `);
            newWindow.document.close();
        }

        function deleteApp(index) {
            const pin = prompt("Enter PIN to delete app:");
            if (pin === ADMIN_PIN) {
                apps.splice(index, 1);
                localStorage.setItem('storeApps', JSON.stringify(apps));
                renderApps();
            } else {
                alert("Incorrect PIN!");
            }
        }
        document.body.style.cursor = "url('mouse.png'), auto";

        renderApps();
    </script>
</body>
</html>
