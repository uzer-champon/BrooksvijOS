<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brooksvij OS - Calendar</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #1e1e24;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .top-bar {
      width: 100%;
      max-width: 450px;
      display: flex;
      justify-content: flex-start;
      margin-bottom: 15px;
    }

    .home-btn {
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s ease;
    }

    .home-btn:hover {
      background-color: #2563eb;
    }

    .calendar-container {
      background-color: #2a2b36;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 450px;
      overflow: hidden;
      padding: 20px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f3f4f6;
    }

    .nav-buttons button {
      background: #374151;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 5px;
      transition: background 0.2s;
    }

    .nav-buttons button:hover {
      background: #4b5563;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      color: #9ca3af;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .day {
      padding: 12px 0;
      border-radius: 8px;
      background-color: #374151;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day:hover {
      background-color: #4b5563;
    }

    .day.empty {
      background-color: transparent;
      cursor: default;
    }

    .day.today {
      background-color: #3b82f6;
      font-weight: bold;
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="brooksvij OS.html" class="home-btn">← Home (Brooksvij OS)</a>
  </div>

  <div class="calendar-container">
    <div class="calendar-header">
      <h2 id="monthYear"></h2>
      <div class="nav-buttons">
        <button id="prevBtn">&lt;</button>
        <button id="nextBtn">&gt;</button>
      </div>
    </div>
    <div class="weekdays">
      <div>Sun</div>
      <div>Mon</div>
      <div>Tue</div>
      <div>Wed</div>
      <div>Thu</div>
      <div>Fri</div>
      <div>Sat</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <script>
    const monthYearEl = document.getElementById('monthYear');
    const daysGridEl = document.getElementById('daysGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    let currentDate = new Date();

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const firstDayIndex = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const months = [
        'January', 'February', 'March', 'April', 'May', 'June',
        'July', 'August', 'September', 'October', 'November', 'December'
      ];

      monthYearEl.textContent = `${months[month]} ${year}`;
      daysGridEl.innerHTML = '';

      // Blank spaces for days before the 1st of the month
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day', 'empty');
        daysGridEl.appendChild(emptyCell);
      }

      // Populate days of the month
      const today = new Date();
      for (let day = 1; day <= daysInMonth; day++) {
        const dayCell = document.createElement('div');
        dayCell.classList.add('day');
        dayCell.textContent = day;

        if (
          day === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear()
        ) {
          dayCell.classList.add('today');
        }

        daysGridEl.appendChild(dayCell);
      }
    }

    prevBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });
document.body.style.cursor = "url('mouse.png'), auto";
    renderCalendar();
  </script>
</body>
</html>
