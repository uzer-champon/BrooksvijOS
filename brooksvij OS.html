    <!-- Date and Time Display Container -->
    <div id="datetime-display"></div>

    <!-- JavaScript Link or Inline Script -->
    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Format the date and time cleanly
            const options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                hour: '2-digit', 
                minute: '2-digit', 
                
            };
           
            
            const formattedDateTime = now.toLocaleDateString('en-US', options);
            
            // Inject into the HTML container
            document.getElementById('datetime-display').textContent = formattedDateTime;
        }

        // Run the function immediately when the page loads
        updateDateTime();
        
        // Update the clock every 1 second (1000 milliseconds)
        setInterval(updateDateTime, 1000);
    </script>
